<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sky Hub Tycoon</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-money">
        <div class="money" data-b="money"></div>
        <div class="income" data-b="income"></div>
      </div>
      <div class="hud-pill"><span data-b="satEmoji"></span> <b data-b="sat"></b></div>
      <div class="hud-pill">⭐ <b data-b="rep"></b></div>
    </header>
    <div id="buffs"></div>
    <main id="view"></main>
    <nav id="tabs">
      <button data-tab="airport"><span>🛫</span>Airport</button>
      <button data-tab="build"><span>🏗️</span>Build</button>
      <button data-tab="airlines"><span>✈️</span>Airlines<i class="dot" data-show="badgeAirlines"></i></button>
      <button data-tab="upgrades"><span>🔬</span>Upgrades<i class="dot" data-show="badgeUpgrades"></i></button>
      <button data-tab="goals"><span>🎯</span>Goals<i class="dot" data-show="badgeGoals"></i></button>
    </nav>
  </div>
  <div id="plane-layer"></div>
  <div id="toasts"></div>
  <div id="modal" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
